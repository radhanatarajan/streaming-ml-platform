[project]
name = "streamml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "radhanatarajan", email = "radhanatarajan@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka[avro]>=2.15.1",
]

[project.scripts]
streamml = "streamml:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
